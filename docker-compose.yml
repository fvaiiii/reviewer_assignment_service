services:
  postgres-reviewer-assignment:
    image: postgres:17.0-alpine3.20
    container_name: postgres-reviewer-assignment
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-reviewer-data:/var/lib/postgresql/data
      - ${MIGRATION_DIRECTORY}:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      timeout: 5s    
      retries: 5     

    restart: unless-stopped

    networks:
      - microservices-net 

volumes:
  postgres-reviewer-data:

networks:
  microservices-net:
    driver: bridge

